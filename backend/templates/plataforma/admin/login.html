{% load i18n static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site_title }} — Entrar</title>
  <link rel="stylesheet" href="{% static 'admin/css/base.css' %}">
  <link rel="stylesheet" href="{% static 'admin/css/login.css' %}">
</head>
<body class="login">
  <div id="container">
    <div id="header"><div id="branding"><h1 id="site-name">{{ site_header }}</h1></div></div>
    <div id="content-main">
      {% if erro %}
        <p class="errornote">{{ erro }}</p>
      {% endif %}
      <form method="post" id="login-form">
        {% csrf_token %}
        <div class="form-row">
          <label for="id_email">E-mail</label>
          <input type="email" name="email" id="id_email" autofocus required>
        </div>
        <div class="form-row">
          <label for="id_senha">Senha</label>
          <input type="password" name="senha" id="id_senha" required>
        </div>
        <div class="submit-row">
          <input type="submit" value="Entrar">
        </div>
      </form>
    </div>
  </div>
</body>
</html>
