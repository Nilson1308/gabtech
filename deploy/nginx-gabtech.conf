# ---------- Tenants (HTTP → redirect quando Certbot ativo nos vhosts nomeados) ----------
server {
    listen 80;
    listen [::]:80;
    server_name ~^(?<subdomain>[a-z0-9-]+)\.gabtech\.app\.br$;

    if ($subdomain = api) { return 444; }
    if ($subdomain = app) { return 444; }
    if ($subdomain = www) { return 301 https://gabtech.app.br$request_uri; }

    client_max_body_size 32m;

    include /var/www/gabtech/deploy/nginx-gabtech-locations-spa-api.inc;
}

# ---------- Acesso por IP (até DNS propagar; use Host real via /etc/hosts) ----------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 168.231.91.74 _;

    client_max_body_size 32m;

    include /var/www/gabtech/deploy/nginx-gabtech-locations-spa-api.inc;
}

