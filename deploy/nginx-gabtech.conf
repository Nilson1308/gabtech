# GabTech — SPA (Vue) + API (Gunicorn)
# Instalar: ln -sf /var/www/gabtech/deploy/nginx-gabtech.conf /etc/nginx/sites-enabled/gabtech
#           rm -f /etc/nginx/sites-enabled/default   # opcional

upstream gabtech_gunicorn {
    server 127.0.0.1:8800 fail_timeout=0;
}

# ---------- API dedicada (schema public: cadastro, health) ----------
server {
    server_name api.gabtech.app.br;

    client_max_body_size 32m;

    include /var/www/gabtech/deploy/nginx-gabtech-locations-api.inc;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/gabtech.app.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/gabtech.app.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot



}

# ---------- App / marketing (SPA + API no mesmo host) ----------
server {
    server_name app.gabtech.app.br gabtech.app.br;

    client_max_body_size 32m;

    include /var/www/gabtech/deploy/nginx-gabtech-locations-spa-api.inc;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/gabtech.app.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/gabtech.app.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot






}

# ---------- Tenants (*.gabtech.app.br) — SSL: incluir após certbot ou cert wildcard ----------
